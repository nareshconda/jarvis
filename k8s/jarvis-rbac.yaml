apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-sa
  namespace: jarvis-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jarvis-cluster-manager
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jarvis-cluster-manager-binding
subjects:
- kind: ServiceAccount
  name: jarvis-sa
  namespace: jarvis-server
roleRef:
  kind: ClusterRole
  name: jarvis-cluster-manager
  apiGroup: rbac.authorization.k8s.io
