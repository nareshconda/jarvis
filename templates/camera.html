<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS Camera</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="static/common_jarvis.css">
<style>
  body{margin:0;background:#050a0f;display:flex;flex-direction:column;min-height:100vh}
  #camWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
           font-family:monospace;padding:10px}
  #cam{max-width:100%;max-height:82vh;display:block;border:1px solid #005f73;border-radius:8px}
  #st{color:#5eead4;font-size:12px;padding:8px;text-align:center}
</style>
</head>
<body>

<header class="jarvis-global-header">
  <div style="width: 250px;"></div>

  <div class="header-dropdown-container">
    <div class="hud-title" onclick="toggleHeaderMenu()">
      CAMERA FEED <i class="fas fa-caret-down" style="font-size: 0.7em; margin-left: 5px;"></i>
    </div>
    <div id="headerDropdownMenu" class="header-dropdown-menu">
      <a href="#" onclick="navTo(''); return false;"><i class="fas fa-comment-dots" style="width: 20px; text-align: center;"></i> Jarvis Chat</a>
      <a href="#" onclick="navTo('/notes'); return false;"><i class="fas fa-sticky-note" style="width: 20px; text-align: center;"></i> Notes &amp; Reminders</a>
      <a href="#" onclick="navTo('/kiosk'); return false;"><i class="fas fa-tv" style="width: 20px; text-align: center;"></i> Kiosk Stream</a>
      <a href="#" onclick="navTo('/camera'); return false;"><i class="fas fa-video" style="width: 20px; text-align: center;"></i> Camera Feed</a>
      <a href="#" onclick="navTo('/cloud'); return false;"><i class="fas fa-cloud" style="width: 20px; text-align: center;"></i> Jarvis Cloud</a>
      <a href="#" onclick="goToHA(); return false;"><i class="fas fa-home" style="width: 20px; text-align: center;"></i> HA Control Center</a>
    </div>
  </div>

  <div style="width: 250px; display: flex; justify-content: flex-end;">
    <div class="status-indicator">
      <div class="orb pulse"></div>
      <span>Live</span>
    </div>
  </div>
</header>

<div id="camWrap">
  <img id="cam" alt="camera feed">
  <div id="st">connecting...</div>
</div>

<script>
function toggleHeaderMenu() { document.getElementById('headerDropdownMenu').classList.toggle('show'); }
window.onclick = function(e) { if (!e.target.closest('.header-dropdown-container')) { document.querySelectorAll('.header-dropdown-menu').forEach(d => d.classList.remove('show')); } }

let basePath = window.location.pathname.replace(/\/camera\/?$/, '').replace(/\/$/, '');

function navTo(path) {
  if (path === '') { window.location.href = basePath || '/'; }
  else { window.location.href = basePath + path; }
}

function goToHA() {
  const host = window.location.hostname;
  if (window.location.pathname.includes('/api/hassio_ingress')) { window.open('/', '_blank'); }
  else { fetch('api/devices').then(r => r.json()).then(c => { const l = (c.links || {}).home_assistant || {}; const h = window.location.hostname; const lan = h === 'localhost' || /^(192\.168\.|10\.)/.test(h); const u = (lan ? (l.lan || l.public) : (l.public || l.lan)); if (u) window.open(u, '_blank'); }); }
}

var img = document.getElementById('cam');
var st  = document.getElementById('st');
var gotFrame = false, polling = false;

img.addEventListener('load', function(){
  gotFrame = true;
  if (!polling) st.textContent = 'live - stream';
});
img.addEventListener('error', function(){       // stream blocked or died
  if (!polling) startPolling();
});

img.src = basePath + '/camera/stream';          // primary: full MJPEG stream
setTimeout(function(){ if (!gotFrame) startPolling(); }, 3000);  /* fallback watchdog */

function startPolling(){                        // fallback only
  if (polling) return;
  polling = true;
  st.textContent = 'live - snapshots';
  var busy = false;
  setInterval(function(){
    if (busy) return;
    busy = true;
    fetch(basePath + '/camera/snapshot?ts=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ if (!r.ok) throw 0; return r.blob(); })
      .then(function(b){
        var u = URL.createObjectURL(b);
        var old = img.src;
        img.src = u;
        st.textContent = 'live - snapshots';
        if (old && old.indexOf('blob:') === 0) URL.revokeObjectURL(old);
      })
      .catch(function(){ st.textContent = 'camera unreachable - retrying...'; })
      .finally(function(){ busy = false; });
  }, 100);                                      /* snapshot rate: 100ms = 10 fps */
}
</script>
</body>
</html>
