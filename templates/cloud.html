<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS Cloud</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="static/common_jarvis.css">
<style>
  body{margin:0;background:#050a0f;display:flex;flex-direction:column;min-height:100vh;height:100vh}
  #cloudBar{display:flex;align-items:center;justify-content:center;gap:10px;
            padding:6px 10px;background:rgba(5,10,15,0.9);border-bottom:1px solid rgba(0,210,255,0.12);
            font-family:monospace;font-size:12px;color:#88c0d0;flex:0 0 auto}
  #cloudBar button{display:inline-flex;align-items:center;gap:6px;background:rgba(0,210,255,0.1);
            border:1px solid rgba(0,210,255,0.35);color:#9fe9ff;font-family:monospace;font-size:12px;
            padding:4px 10px;border-radius:8px;cursor:pointer;-webkit-appearance:none;appearance:none}
  #cloudBar button:hover{background:rgba(0,210,255,0.25);color:#fff}
  #cloudFrame{flex:1;width:100%;border:none;background:#0b1218}
</style>
</head>
<body>

<header class="jarvis-global-header">
  <div style="width: 250px;"></div>

  <div class="header-dropdown-container">
    <div class="hud-title" onclick="toggleHeaderMenu()">
      JARVIS CLOUD <i class="fas fa-caret-down" style="font-size: 0.7em; margin-left: 5px;"></i>
    </div>
    <div id="headerDropdownMenu" class="header-dropdown-menu">
      <a href="#" onclick="navTo(''); return false;"><i class="fas fa-comment-dots" style="width: 20px; text-align: center;"></i> Jarvis Chat</a>
      <a href="#" onclick="navTo('/notes'); return false;"><i class="fas fa-sticky-note" style="width: 20px; text-align: center;"></i> Notes &amp; Reminders</a>
      <a href="#" onclick="navTo('/kiosk'); return false;"><i class="fas fa-tv" style="width: 20px; text-align: center;"></i> Kiosk Stream</a>
      <a href="#" onclick="navTo('/camera'); return false;"><i class="fas fa-video" style="width: 20px; text-align: center;"></i> Camera Feed</a>
      <a href="#" onclick="navTo('/cloud'); return false;"><i class="fas fa-cloud" style="width: 20px; text-align: center;"></i> Jarvis Cloud</a>
      <a href="#" onclick="goToHA(); return false;"><i class="fas fa-home" style="width: 20px; text-align: center;"></i> HA Control Center</a>
    </div>
  </div>

  <div style="width: 250px; display: flex; justify-content: flex-end;">
    <a href="{{ files_url }}" target="_blank" rel="noopener"
       style="display:flex;align-items:center;gap:8px;color:#00ff6a;text-decoration:none;font-family:monospace;font-size:14px;">
      <i class="fas fa-arrow-up-right-from-square"></i> Open
    </a>
  </div>
</header>

<div id="cloudBar">
  <span>Failed to Load? Click: </span>
  <button type="button" onclick="cloudLogin()"><i class="fas fa-key"></i> Sign in</button>
  <button type="button" onclick="cloudReload()"><i class="fas fa-rotate-right"></i> Reload</button>
</div>

<iframe id="cloudFrame" src="{{ files_url }}" allow="fullscreen"></iframe>

<script>
window.FILES_URL = {{ files_url|tojson }};
function toggleHeaderMenu() { document.getElementById('headerDropdownMenu').classList.toggle('show'); }
window.onclick = function(e) { if (!e.target.closest('.header-dropdown-container')) { document.querySelectorAll('.header-dropdown-menu').forEach(d => d.classList.remove('show')); } }

let basePath = window.location.pathname.replace(/\/cloud\/?$/, '').replace(/\/$/, '');

function navTo(path) {
  if (path === '') { window.location.href = basePath || '/'; }
  else { window.location.href = basePath + path; }
}

function goToHA() {
  const host = window.location.hostname;
  if (window.location.pathname.includes('/api/hassio_ingress')) { window.open('/', '_blank'); }
  else { fetch('api/devices').then(r => r.json()).then(c => { const l = (c.links || {}).home_assistant || {}; const h = window.location.hostname; const lan = h === 'localhost' || /^(192\.168\.|10\.)/.test(h); const u = (lan ? (l.lan || l.public) : (l.public || l.lan)); if (u) window.open(u, '_blank'); }); }
}

function cloudReload() {
  const f = document.getElementById('cloudFrame');
  f.src = (window.FILES_URL || '') + '?ts=' + Date.now();   // cache-bust so the redirect re-evaluates
}

function cloudLogin() {
  // Open the login in a real tab (Authentik blocks iframes). When that tab is
  // closed - i.e. the user finished signing in - reload the frame automatically.
  const w = window.open(window.FILES_URL || '/', '_blank');
  if (!w) { return; }
  const timer = setInterval(function(){
    if (w.closed) {
      clearInterval(timer);
      cloudReload();
    }
  }, 800);
}
</script>
</body>
</html>
