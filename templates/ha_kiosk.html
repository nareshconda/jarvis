<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JARVIS HA Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/common_jarvis.css"> <style>
        /* Kiosk specific layout overrides */
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            /* Faded Animated Background applied via JS based on basePath */
        }
        #chat-container::-webkit-scrollbar { display: none; }
        
        .msg-wrapper { margin-bottom: 15px; max-width: 90%; display: flex; flex-direction: column; }
        .user-msg { margin-left: auto; align-items: flex-end; }
        .user-bubble { background: #1a232a; border: 1px solid #3b4252; padding: 12px 16px; border-radius: 8px 8px 0 8px; font-size: 18px; color: #eceff4; }
        .jarvis-msg { margin-right: auto; align-items: flex-start; }
        .jarvis-header { font-size: 13px; color: #00d2ff; margin-bottom: 4px; text-transform: uppercase; }
        .jarvis-bubble { background: #0b1924; border: 1px solid #005f73; border-left: 3px solid #00d2ff; padding: 12px 16px; border-radius: 0 8px 8px 8px; font-size: 19px; color: #e5e9f0; line-height: 1.3; }
        
        p { margin: 0 0 8px 0; } p:last-child { margin-bottom: 0; }
        pre, code { font-family: monospace; color: #00ff6a; background: #000; padding: 4px; border-radius: 4px; }
        .err { color: #ff4444; border: 1px dashed #ff4444; padding: 20px; font-size: 16px; margin: 20px; }
    </style>
</head>
<body>

    <header class="jarvis-global-header">
      <div class="header-dropdown-container">
        <div class="hud-title" onclick="toggleHeaderMenu()">
          KIOSK STREAM <i class="fas fa-caret-down" style="font-size: 0.7em;"></i>
        </div>
        <div id="headerDropdownMenu" class="header-dropdown-menu">
          <a href="#" onclick="navTo(''); return false;"><i class="fas fa-comment-dots"></i> Jarvis Chat</a>
          <a href="#" onclick="navTo('/notes'); return false;"><i class="fas fa-sticky-note"></i> Notes & Reminders</a>
          <a href="#" onclick="navTo('/kiosk'); return false;"><i class="fas fa-tv"></i> Kiosk Stream</a>
          <a href="#" onclick="goToHA(); return false;"><i class="fas fa-home"></i> HA Control Center</a>
        </div>
      </div>
      <div class="status-indicator">
        <div class="orb pulse"></div>
        <span>Online</span>
      </div>
    </header>

    <div id="chat-container"></div>

    <script>    
        // SMART DROPDOWN LOGIC
        function toggleHeaderMenu() { document.getElementById('headerDropdownMenu').classList.toggle('show'); }
        window.onclick = function(e) { if (!e.target.closest('.header-dropdown-container')) { document.querySelectorAll('.header-dropdown-menu').forEach(d => d.classList.remove('show')); } }
        
        // ROBUST BASE PATH FOR KIOSK
        let basePath = window.location.pathname.replace(/\/kiosk\/ha\/?$/, '').replace(/\/kiosk\/?$/, '').replace(/\/$/, '');
        
        function navTo(path) { 
            if (path === '') { window.location.href = basePath || '/'; } 
            else { window.location.href = basePath + path; }
        }

        function goToHA() {
            const host = window.location.hostname;
            if (window.location.pathname.includes('/api/hassio_ingress')) { window.open('/', '_blank'); } 
            else { fetch('api/devices').then(r => r.json()).then(c => { const l = (c.links || {}).home_assistant || {}; const h = window.location.hostname; const lan = h === 'localhost' || /^(192\.168\.|10\.)/.test(h); const u = (lan ? (l.lan || l.public) : (l.public || l.lan)); if (u) window.open(u, '_blank'); }); }
        }

        // Uses the browser's login session: open /login once on the kiosk device.
        const fetchOptions = { method: 'GET', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }};

        const chatContainer = document.getElementById('chat-container');
        let voiceChatId = null;
        let knownMessageCount = 0; 

        // BULLETPROOF AUTO-SCROLL
        const observer = new MutationObserver(() => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
        observer.observe(chatContainer, { childList: true, subtree: true });

        async function initializeKiosk() {
            try {
                const res = await fetch(`${basePath}/api/voice/session`, fetchOptions);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                voiceChatId = data.chat_id;
                await fetchLatestMessages();
                setInterval(fetchLatestMessages, 3000);
            } catch (err) {
                chatContainer.innerHTML = `<div class="err"><strong>CONNECTION ERROR:</strong> ${err.message}</div>`;
            }
        }

        async function fetchLatestMessages() {
            if (!voiceChatId) return;
            try {
                const res = await fetch(`${basePath}/api/chats/${voiceChatId}/messages`, fetchOptions);
                const data = await res.json();
                const messages = data.messages;
                if (messages.length > knownMessageCount) {
                    const newMessages = messages.slice(knownMessageCount);
                    newMessages.forEach(msg => { appendMessage(msg); });
                    knownMessageCount = messages.length;
                }
            } catch (err) { console.error("Polling error:", err); }
        }

        function appendMessage(msg) {
            const wrapper = document.createElement('div');
            if (msg.role === 'user') {
                wrapper.className = 'msg-wrapper user-msg';
                wrapper.innerHTML = `<div class="user-bubble">${msg.content}</div>`;
            } else {
                wrapper.className = 'msg-wrapper jarvis-msg';
                const contentToDisplay = (msg.html && msg.html.trim()) ? msg.html : `<p>${msg.content}</p>`;
                wrapper.innerHTML = `<div class="jarvis-header">Jarvis</div><div class="jarvis-bubble">${contentToDisplay}</div>`;
            }
            chatContainer.appendChild(wrapper);
        }

        initializeKiosk();
    </script>

</body>
</html>
